<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="Ndapa Nakashole">
  <meta name="keywords" content="Ndapa Nakashole, NLP, Natural Language Processing, Artificial Intelligence, UCSD, UC San Diego, multilingual, African languages, Okalai AI, computer science, machine learning, low-resource languages, knowledge bases">

  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

</head>
<body>

<div class="accent-bar"></div>

<header class="site-header">
  <div class="hero-inner">
    <div class="hero-photo">
      <div class="photo-frame">
        <img src="{{ '/assets/images/profile3.jpg' | relative_url }}" alt="Photo of {{ site.author.name }}" class="profile-image" />
      </div>
    </div>
    <div class="hero-text">
      <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a> <a href="{{ '/assets/audio/name.mp3' | relative_url }}" title="Hear my name" class="name-audio">🔊</a></h1>
      <nav>
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a>
        <a href="{{ '/research/' | relative_url }}"{% if page.url == '/research/' %} class="active"{% endif %}>Research</a>
        <a href="{{ '/teaching/' | relative_url }}"{% if page.url == '/teaching/' %} class="active"{% endif %}>Teaching</a>
      </nav>
    </div>
  </div>
</header>


  <main class="container">
    {{ content }}
  </main>
